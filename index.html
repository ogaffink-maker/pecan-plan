<script id="js">
(function(){
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

var app=document.getElementById('app');
var art=null,canEdit=false,dirty=false,busy=false,toastT=null,firstScroll=true;

function dn(s){return Math.round(Date.parse(s+'T00:00:00Z')/864e5)}
function iso(n){return new Date(n*864e5).toISOString().slice(0,10)}
var now=new Date();
var TODAY=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2);
var T=dn(TODAY);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fd(s,y){var p=s.split('-');return +p[2]+' '+MON[+p[1]-1]+(y?' '+p[0]:'')}
function fr(t){if(t.s===t.e)return fd(t.s);var a=t.s.split('-'),b=t.e.split('-');return a[1]===b[1]?+a[2]+'–'+fd(t.e):fd(t.s)+' – '+fd(t.e)}
function role(k){for(var i=0;i<S.roles.length;i++)if(S.roles[i].k===k)return S.roles[i];return S.roles[0]}
function task(id){for(var i=0;i<S.tasks.length;i++)if(S.tasks[i].i===id)return S.tasks[i];return null}
function st(t){return t.g>=100?'done':dn(t.e)<T?'late':dn(t.s)<=T?'now':'plan'}
var STN={done:'Готово',late:'Просрочено',now:'В работе',plan:'В плане'};
function plural(n,a,b,c){n=Math.abs(n);var m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>1&&k<5?b:c}
function days(n){return n+' '+plural(n,'день','дня','дней')}
function prog(list){var w=0,g=0;list.forEach(function(t){var d=t.m?1:dn(t.e)-dn(t.s)+1;w+=d;g+=d*t.g});return w?Math.round(g/w):0}
function visible(t){
  var any=Object.keys(F.roles).length;
  if(any&&!F.roles[t.r])return false;
  var s=st(t);
  if(F.mode==='open')return s!=='done';
  if(F.mode==='now')return s==='now'||s==='late';
  if(F.mode==='late')return s==='late';
  if(F.mode==='ms')return !!t.m;
  if(F.mode==='crit')return !!t.c;
  if(F.mode==='14')return s!=='done'&&dn(t.s)<=T+14&&dn(t.e)>=T;
  return true}
function tags(t){var s=st(t),o='';
  if(s==='late')o+='<span class="tag late">просрочено</span>';
  if(t.x&&s!=='done')o+='<span class="tag late">риск</span>';
  return o}

function head(){
  var soft=task(S.soft),grand=task(S.grand),p=prog(S.tasks);
  var wk=Math.max(1,Math.floor((T-dn('2026-09-28'))/7)+1);
  function cd(t,label){if(!t)return'';var d=dn(t.s)-T;
    return '<div class="stat"><span>'+label+'</span><b>'+(d>0?days(d):d===0?'Сегодня':'Открыто')+'</b><em>'+fd(t.s,1)+'</em></div>'}

function brief(){
  function row(t,when){return '<button class="item" data-open="'+t.i+'"><span class="when">'+when+'</span><span class="t">'+esc(t.n)+tags(t)+'<br><span class="chip" style="--rc:var(--r-'+t.r+')">'+esc(role(t.r).n)+'</span></span></button>'}
  var cur=S.tasks.filter(function(t){var s=st(t);return s==='now'||s==='late'}).sort(function(a,b){return dn(a.e)-dn(b.e)});
  var next=S.tasks.filter(function(t){return st(t)==='plan'&&dn(t.s)<=T+14}).sort(function(a,b){return dn(a.s)-dn(b.s)});
  return '<div class="duo"><section><h2>Сейчас в работе</h2><div class="list">'+
    (cur.length?cur.map(function(t){return row(t,'до '+fd(t.e))}).join(''):'<div class="empty">Активных задач нет.</div>')+'</div></section>'+
    '<section><h2>Начнётся в ближайшие 14 дней</h2><div class="list">'+

function tabs(){
  var t=[['gantt','График'],['milestones','Вехи'],['roles','Роли']];

function tools(){
  var any=Object.keys(F.roles).length;
  var o='<div class="tools">'+S.roles.map(function(r){return '<button class="pill role'+(any&&!F.roles[r.k]?' off':'')+'" style="--rc:var(--r-'+r.k+')" data-role="'+r.k+'" aria-pressed="'+!!F.roles[r.k]+'">'+esc(r.n)+'</button>'}).join('')+'</div>';
  var modes=[['all','Все задачи'],['open','Незавершённые'],['now','В работе и просроченные'],['14','Ближайшие 14 дней'],['late','Только просроченные'],['ms','Только вехи'],['crit','Критический путь']];
  o+='<div class="tools"><select id="mode" aria-label="Показать">'+modes.map(function(m){return '<option value="'+m[0]+'"'+(F.mode===m[0]?' selected':'')+'>'+m[1]+'</option>'}).join('')+'</select>'+
    '<select id="zoom" aria-label="Масштаб">'+[[5,'Масштаб: весь проект'],[9,'Масштаб: недели'],[20,'Масштаб: дни']].map(function(m){return '<option value="'+m[0]+'"'+(F.zoom===m[0]?' selected':'')+'>'+m[1]+'</option>'}).join('')+'</select>'+
    '<button class="pill" data-act="today">К сегодняшнему дню</button><span class="spacer"></span>'+
    (canEdit?'<button class="btn" data-act="add">Добавить задачу</button>':'')+'</div>';
  return o}

function gantt(){
  var r0=dn(S.range[0]),r1=dn(S.range[1]),dw=F.zoom,W=(r1-r0+1)*dw;
  function x(s){return (dn(s)-r0)*dw}
  var sc='',d,m=-1;
  for(d=r0;d<=r1;d++){var D=new Date(d*864e5),mm=D.getUTCMonth();
    if(mm!==m){m=mm;var nx=Date.UTC(D.getUTCFullYear(),mm+1,1)/864e5;var w=(Math.min(nx,r1+1)-d)*dw;
      sc+='<div class="mo" style="left:'+(d-r0)*dw+'px;width:'+w+'px">'+(w>70?MONF[mm]+' '+D.getUTCFullYear():MON[mm])+'</div>'}
    if(D.getUTCDay()===1)sc+='<div class="wk" style="left:'+(d-r0)*dw+'px;width:'+7*dw+'px">'+D.getUTCDate()+'</div>'}
  var ov='';
  var mk=S.marks.slice().sort(function(a,b){return dn(a.s)-dn(b.s)});
  mk.forEach(function(k,i){var l=x(k.s),w=(dn(k.e)-dn(k.s)+1)*dw,nx=i+1<mk.length?x(mk[i+1].s):W;
    sc+='<div class="ev" title="'+esc(k.n)+'" style="left:'+l+'px;max-width:'+Math.max(w,nx-l-4)+'px">'+esc(k.n)+'</div>';
    ov+='<div class="band2" style="left:'+l+'px;width:'+w+'px"></div>'});
  if(T>=r0&&T<=r1){sc+='<div class="now" style="left:'+((T-r0)*dw)+'px">сегодня</div>';ov+='<div class="today" style="left:'+((T-r0)*dw+dw/2-1)+'px"></div>'}
  var rows='',shown=0;
  S.phases.forEach(function(p){
    var all=S.tasks.filter(function(t){return t.p===p.k}),list=all.filter(visible);
    if(!list.length)return;shown+=list.length;
    var a=Math.min.apply(0,all.map(function(t){return dn(t.s)})),b=Math.max.apply(0,all.map(function(t){return dn(t.e)})),pg=prog(all);
    rows+='<div class="grow phase"><button class="gname" data-phase="'+p.k+'" aria-expanded="'+!F.closed[p.k]+'"><span class="n">'+(F.closed[p.k]?'▸ ':'▾ ')+esc(p.n)+'</span><span class="pc">'+fd(iso(a))+' – '+fd(iso(b))+' · '+pg+'%</span></button>'+
      '<div class="gtrack" style="width:'+W+'px;--ww:'+7*dw+'px"><div class="pbar" style="left:'+(a-r0)*dw+'px;width:'+(b-a+1)*dw+'px"><i style="width:'+pg+'%"></i></div></div></div>';
    if(F.closed[p.k])return;
    list.sort(function(u,v){return dn(u.s)-dn(v.s)||dn(u.e)-dn(v.e)}).forEach(function(t){
      var s=st(t),l=x(t.s),w=(dn(t.e)-dn(t.s)+1)*dw,bar,lx;
      if(t.m){bar='<button class="ms'+(t.g>=100?'':' open')+'" data-open="'+t.i+'" aria-label="'+esc(t.n)+'" style="left:'+(l+dw/2)+'px;--rc:'+(s==='late'?'var(--late)':'var(--r-'+t.r+')')+'"></button>';lx=l+dw/2+14}
      else{bar='<button class="bar'+(s==='late'?' late':'')+'" data-open="'+t.i+'" aria-label="'+esc(t.n)+'" style="left:'+l+'px;width:'+w+'px;--rc:var(--r-'+t.r+')"><i style="width:'+t.g+'%"></i></button>';lx=l+w+7}
      rows+='<div class="grow"><button class="gname" data-open="'+t.i+'"><span class="n'+(s==='done'?' done':'')+'">'+esc(t.n)+tags(t)+'</span><span class="chip" style="--rc:var(--r-'+t.r+')">'+esc(role(t.r).n)+'</span></button>'+
        '<div class="gtrack" style="width:'+W+'px;--ww:'+7*dw+'px">'+bar+'<span class="lbl" style="left:'+lx+'px">'+fr(t)+(t.g>0&&t.g<100?' · '+t.g+'%':'')+'</span></div></div>'})});
  if(!shown)rows='<div class="empty" style="padding:24px 16px">Под этот фильтр задач нет. Сбросьте фильтр по ролям или выберите «Все задачи».</div>';
  return tools()+'<div class="gwrap" id="gw"><div class="ginner"><div class="ghead"><div class="corner">Работа · ответственный</div><div class="scale" style="width:'+W+'px">'+sc+'</div></div>'+
    '<div class="gover" style="left:var(--nw);width:'+W+'px">'+ov+'</div>'+rows+'</div></div>'+
    '<p class="chip" style="--rc:transparent;white-space:normal">Полоса закрашена на долю выполнения. Ромб обозначает веху, пустой ромб ещё не пройден. Нажмите на строку, чтобы открыть детали.</p>'}

function milestones(){
  var ms=S.tasks.filter(function(t){return t.m}).sort(function(a,b){return dn(a.s)-dn(b.s)});
  return '<div class="scroll"><table class="mtable"><thead><tr><th>Дата</th><th>Веха</th><th>Ответственный</th><th>Статус</th></tr></thead><tbody>'+
    ms.map(function(t){var s=st(t);return '<tr class="'+(s==='done'?'past':'')+'"><td>'+fd(t.s,1)+'</td><td><button class="item" style="display:inline;border:0;padding:0" data-open="'+t.i+'"><span class="t">'+esc(t.n)+'</span></button>'+(t.c?'<span class="tag crit">критический путь</span>':'')+'</td><td><span class="chip" style="--rc:var(--r-'+t.r+')">'+esc(role(t.r).n)+'</span></td><td>'+(s==='late'?'<span style="color:var(--late)">Просрочено</span>':s==='done'?'<span style="color:var(--ok)">Пройдена</span>':dn(t.s)===T?'Сегодня':'через '+days(dn(t.s)-T))+'</td></tr>'}).join('')+
    '</tbody></table></div><section><h2>На чём держится график</h2><ul class="notes">'+S.notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join('')+'</ul></section>'}

function roles(){
  return '<div class="cards">'+S.roles.map(function(r){
    var mine=S.tasks.filter(function(t){return t.r===r.k}),open=mine.filter(function(t){return st(t)!=='done'}).sort(function(a,b){return dn(a.s)-dn(b.s)});
    return '<article class="card" style="--rc:var(--r-'+r.k+')"><div><h3>'+esc(r.n)+'</h3><div class="who">'+esc(r.who)+'</div></div><ul>'+r.duties.map(function(d){return '<li>'+esc(d)+'</li>'}).join('')+'</ul>'+
      '<div class="num">'+mine.length+' '+plural(mine.length,'задача','задачи','задач')+' в плане, выполнено '+(mine.length-open.length)+'</div>'+
      (open.length?'<div class="list">'+open.slice(0,3).map(function(t){return '<button class="item" data-open="'+t.i+'"><span class="when">'+fr(t)+'</span><span class="t">'+esc(t.n)+tags(t)+'</span></button>'}).join('')+'</div>':'')+
      '<button class="btn ghost" data-only="'+r.k+'">Показать на графике</button></article>'}).join('')+'</div>'}

function render(){
  var gw=document.getElementById('gw'),sl=gw?gw.scrollLeft:null,stp=gw?gw.scrollTop:0,wy=window.scrollY;
  app.innerHTML=head()+brief()+tabs()+(F.tab==='gantt'?gantt():F.tab==='roles'?roles():milestones())+
    (window.claude?'':'<p class="dl">Скачать план: <a href="pecan-plan.pdf">PDF для печати</a> · <a href="pecan-plan.xlsx">таблица Excel</a></p>')+'</div>'+
    (dirty?'<div class="savebar"><span>Есть несохранённые изменения</span><button class="btn" data-act="save"'+(busy?' disabled':'')+'>'+(busy?'Сохраняю…':'Сохранить для всех')+'</button><button class="btn ghost" data-act="revert">Отменить</button></div>':'');
  gw=document.getElementById('gw');
  if(gw){if(sl===null||firstScroll){gw.scrollLeft=Math.max(0,(T-dn(S.range[0]))*F.zoom-60);firstScroll=false}else{gw.scrollLeft=sl;gw.scrollTop=stp}}
  window.scrollTo(0,wy)}

function toast(msg){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},6000)}

/* ---------- task dialog ---------- */
var dlg=document.createElement('dialog');document.body.appendChild(dlg);
function openTask(id){
  var t=id?task(id):null,isNew=!t;
  if(isNew)t={i:'',p:S.phases[0].k,n:'',r:'gu',s:TODAY,e:iso(T+6),g:0};
  if(!canEdit){
    var s=st(t);
    dlg.innerHTML='<div class="dlg"><h3>'+esc(t.n)+'</h3><dl><dt>Срок</dt><dd>'+(t.s===t.e?fd(t.s,1):fd(t.s,1)+' – '+fd(t.e,1)+' · '+days(dn(t.e)-dn(t.s)+1))+'</dd>'+
      '<dt>Ответственный</dt><dd><span class="chip" style="--rc:var(--r-'+t.r+')">'+esc(role(t.r).n)+'</span></dd>'+
      (t.w?'<dt>Участвуют</dt><dd>'+esc(t.w)+'</dd>':'')+
      '<dt>Статус</dt><dd>'+STN[s]+(t.m?'':' · '+t.g+'%')+(t.c?' · критический путь':'')+'</dd>'+
      (t.d?'<dt>Детали</dt><dd>'+esc(t.d)+'</dd>':'')+'</dl><div class="acts"><button class="btn" data-dlg="close">Закрыть</button></div></div>';
    dlg.showModal();return}
  dlg.innerHTML='<form class="dlg" id="tf" method="dialog"><h3>'+(isNew?'Новая задача':'Задача')+'</h3>'+
    '<label>Название<input id="f-n" required maxlength="140" value="'+esc(t.n)+'"></label>'+
    '<div class="two"><label>Этап<select id="f-p">'+S.phases.map(function(p){return '<option value="'+p.k+'"'+(p.k===t.p?' selected':'')+'>'+esc(p.n)+'</option>'}).join('')+'</select></label>'+
    '<label>Ответственный<select id="f-r">'+S.roles.map(function(r){return '<option value="'+r.k+'"'+(r.k===t.r?' selected':'')+'>'+esc(r.n)+'</option>'}).join('')+'</select></label></div>'+
    '<div class="two"><label>Начало<input type="date" id="f-s" required value="'+t.s+'"></label><label>Окончание<input type="date" id="f-e" required value="'+t.e+'"></label></div>'+
    '<div class="shift">Сдвинуть: <button type="button" data-shift="-7">−7 дн.</button><button type="button" data-shift="-1">−1</button><button type="button" data-shift="1">+1</button><button type="button" data-shift="7">+7 дн.</button></div>'+
    '<label>Выполнено: <span id="f-gv">'+t.g+'%</span><input type="range" id="f-g" min="0" max="100" step="10" value="'+t.g+'"></label>'+
    '<div class="checks"><label><input type="checkbox" id="f-m"'+(t.m?' checked':'')+'>Веха (одна дата)</label><label><input type="checkbox" id="f-c"'+(t.c?' checked':'')+'>Критический путь</label><label><input type="checkbox" id="f-x"'+(t.x?' checked':'')+'>Под риском</label></div>'+
    '<label>Кто ещё участвует<input id="f-w" maxlength="140" value="'+esc(t.w||'')+'"></label>'+
    '<label>Детали и результат<textarea id="f-d" rows="3" maxlength="600">'+esc(t.d||'')+'</textarea></label>'+
    '<div class="acts">'+(isNew?'':'<button type="button" class="btn danger" data-dlg="del">Удалить</button>')+'<span class="spacer"></span><button type="button" class="btn ghost" data-dlg="close">Отмена</button><button class="btn" type="submit">Применить</button></div></form>';
  dlg.dataset.id=t.i;dlg.showModal()}
function gid(i){return document.getElementById(i)}
dlg.addEventListener('input',function(e){if(e.target.id==='f-g')gid('f-gv').textContent=e.target.value+'%'});
dlg.addEventListener('click',function(e){
  var b=e.target.closest('button');if(e.target===dlg){dlg.close();return}if(!b)return;
  if(b.dataset.shift){var n=+b.dataset.shift;['f-s','f-e'].forEach(function(k){var el=gid(k);if(el.value)el.value=iso(dn(el.value)+n)});return}
  if(b.dataset.dlg==='close'){dlg.close();return}
  if(b.dataset.dlg==='del'){
    if(b.dataset.sure){S.tasks=S.tasks.filter(function(t){return t.i!==dlg.dataset.id});dirty=true;dlg.close();render()}
    else{b.dataset.sure='1';b.textContent='Точно удалить?'}}});
dlg.addEventListener('submit',function(e){
  if(e.target.id!=='tf')return;e.preventDefault();
  var id=dlg.dataset.id,t=id?task(id):null;
  if(!t){t={i:'t'+Date.now().toString(36)};S.tasks.push(t)}
  t.n=gid('f-n').value.trim();t.p=gid('f-p').value;t.r=gid('f-r').value;
  t.s=gid('f-s').value;t.e=gid('f-e').value;
  if(gid('f-m').checked){t.m=1;t.e=t.s}else delete t.m;
  if(dn(t.e)<dn(t.s))t.e=t.s;
  t.g=+gid('f-g').value;
  if(gid('f-c').checked)t.c=1;else delete t.c;
  if(gid('f-x').checked)t.x=1;else delete t.x;
  var w=gid('f-w').value.trim(),d=gid('f-d').value.trim();
  if(w)t.w=w;else delete t.w; if(d)t.d=d;else delete t.d;
  if(dn(t.s)<dn(S.range[0]))S.range[0]=iso(dn(t.s)-((new Date(dn(t.s)*864e5).getUTCDay()+6)%7));
  if(dn(t.e)>dn(S.range[1])-7)S.range[1]=iso(dn(t.e)+14);
  dirty=true;dlg.close();render()});

/* ---------- saving: the page republishes itself with the new plan ---------- */
function buildDoc(){
  var L='<',css=gid('css').textContent,js=gid('js').textContent;
  var data=JSON.stringify(S).replace(/</g,'\\u003c');
  return L+'!doctype html>'+L+'html>'+L+'head>'+L+'meta charset=utf8>'+L+'meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">'+L+'style>'+
    ':root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}'+
    L+'/style>'+L+'/head>'+L+'body>'+
    L+'title>План открытия PECÀN'+L+'/title>\n'+
    L+'link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Lobster&display=swap">\n'+
    L+'style id="css">'+css+L+'/style>\n'+L+'div id="app">'+L+'/div>\n'+
    L+'script type="application/json" id="plan">'+data+L+'/script>\n'+
    L+'script id="js">'+js+L+'/script>\n'+L+'/body>'+L+'/html>'}
function revert(){S=JSON.parse(RAW);dirty=false;render()}
function save(){
  if(!art||busy)return;busy=true;S.updated=TODAY;render();
  art.publish(buildDoc()).then(function(){busy=false;dirty=false;toast('Сохранено. План обновится у всех.');render()},function(err){
    busy=false;var c=err&&err.code;
    if(c==='conflict')toast('Кто-то сохранил план раньше вас. Страница обновится, внесите правку ещё раз.');
    else if(c==='rate_limited'){toast('Слишком частые сохранения. Подождите минуту и сохраните снова.');render()}
    else if(c==='too_large'||c==='invalid_content'||c==='transform_error'){toast('План не сохранился: слишком большой объём текста. Сократите описания.');render()}
    else if(c&&c!=='upstream_error'){canEdit=false;art=null;toast('У вас доступ только для просмотра. Изменения вносит команда Gastro Ultima.');revert()}
    else{toast('Не удалось сохранить. Проверьте соединение и попробуйте ещё раз.');render()}})}

app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.open){openTask(d.open);return}
  if(d.tab){F.tab=d.tab;firstScroll=true;try{history.replaceState(null,'','#'+d.tab)}catch(x){}render();return}
  if(d.role){if(F.roles[d.role])delete F.roles[d.role];else F.roles[d.role]=1;render();return}
  if(d.only){F.roles={};F.roles[d.only]=1;F.mode='all';F.tab='gantt';firstScroll=true;render();return}
  if(d.phase){if(F.closed[d.phase])delete F.closed[d.phase];else F.closed[d.phase]=1;render();return}
  if(d.act==='today'){firstScroll=true;render();return}
  if(d.act==='add'){openTask(null);return}
  if(d.act==='save'){save();return}
  if(d.act==='revert'){revert();return}});
app.addEventListener('change',function(e){
  if(e.target.id==='mode'){F.mode=e.target.value;render()}
  if(e.target.id==='zoom'){F.zoom=+e.target.value;firstScroll=true;try{localStorage.setItem('pecan-zoom',F.zoom)}catch(x){}render()}});

render();
if(window.claude&&window.claude.use)window.claude.use('artifact').then(function(a){if(a){art=a;canEdit=true;render()}},function(){});
})();
</script>

</body></html>
